[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-of-record"
version = "0.1.0"
description = "Agent-of-Record crypto, context ledger, and signature verifier"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "rfc8785>=0.1.4",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["crypto_core/tests", "ledger_core/tests", "verifier_service/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["crypto_core*", "ledger_core*", "verifier_service*"]
