[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-of-record"
version = "0.1.0"
description = "Agent-of-Record crypto, ledger, verifier, proof, and action execution"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "langchain-core>=1.3.0,<1.6.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "rfc8785>=0.1.4",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0,<0.29.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["crypto_core/tests", "ledger_core/tests", "verifier_service/tests", "key_registry/tests", "poi_generator/tests", "action_executor/tests", "verification_portal/backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["crypto_core*", "ledger_core*", "verifier_service*", "key_registry*", "poi_generator*", "action_executor*", "verification_portal*"]
